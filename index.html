<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IronMath</title>
<meta name="description" content="Year 8 maths practice: short lessons, instant marking, streaks and XP.">
<meta name="theme-color" content="#6D4AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IronMath">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <button class="tab" data-go="learn" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Learn</span>
      </button>
      <button class="tab" data-go="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11h3v9zm5.5 0V5h3v15zM16 20v-6h3v6z"/></svg><span>Progress</span>
      </button>
      <button class="tab" data-go="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.3 4.9-1.9 1.1.1 2.2-2.2 1.3-1.9-1.1-1.9 1.1h-2.6l-1.9-1.1-1.9 1.1-2.2-1.3.1-2.2-1.9-1.1v-2.8l1.9-1.1-.1-2.2 2.2-1.3 1.9 1.1L10.7 4h2.6l1.9 1.1 1.9-1.1 2.2 1.3-.1 2.2 1.9 1.1Z"/></svg><span>Settings</span>
      </button>
    </nav>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">IronMath needs JavaScript turned on.</p></noscript>
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="gen.js"></script>
  <script src="gen_u.js"></script>
  <script src="app.js"></script>
</body>
</html>
